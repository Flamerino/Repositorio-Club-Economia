name: Actualizar datos

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 9:00 hora argentina
  workflow_dispatch:
    inputs:
      carga_completa:
        description: "Cargar toda la historia desde los archivos del repo (usar la primera vez)"
        type: boolean
        default: false

permissions:
  contents: write   # para commitear datos/ y el estado de la corrida

# Una sola corrida a la vez: si se lanza otra mientras corre una, espera a que termine
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # una corrida normal tarda ~5 min; si algo se cuelga, se corta acá
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Carga completa desde archivos
        if: ${{ inputs.carga_completa }}
        run: |
          python src/bcra/limpiar.py
          python src/indec/limpiar.py
          python src/cargar_supabase.py bcra indec

      - name: Actualizar BCRA por API
        run: python src/bcra/actualizar_api.py

      - name: Actualizar IPC (API datos.gob.ar)
        run: python src/indec/actualizar_ipc.py

      - name: Actualizar ITCRM (archivo del BCRA)
        run: python src/bcra/actualizar_itcrm.py

      - name: Pobreza e indigencia (EPH y canastas)
        run: |
          python src/indec/pobreza.py
          python src/cargar_supabase.py pobreza

      - name: Fuentes complementarias (lista en src/actualizar_solo_repo.py)
        run: python src/actualizar_solo_repo.py

      - name: Recalcular series de elaboración propia
        run: |
          python src/derivadas/calcular.py
          python src/cargar_supabase.py derivadas

      - name: Exportar un archivo por serie (datos/)
        run: python src/exportar_archivos.py

      - name: Guardar estado de la actualización
        run: |
          python src/estado.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estado_actualizacion.json datos/ $(cat .rutas_solo_repo 2>/dev/null)
          git diff --cached --quiet || (git commit -m "Actualización automática de datos" && git pull --rebase --autostash && git push)
